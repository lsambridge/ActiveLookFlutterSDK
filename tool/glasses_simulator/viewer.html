<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ActiveLook Glasses Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Real hardware renders in SourceSansPro SemiBold (see FONT_PX's doc
     comment) - a proportional font, noticeably narrower per-character than
     the generic `monospace` fallback this viewer used before. That made
     longer strings (e.g. "18.1 mph") clip against the canvas edge here even
     though they fit fine on the actual glasses (confirmed 2026-09-09) -
     loading the real family keeps this simulator's text width close to
     what the device actually renders. -->
<link
  href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@600&display=swap"
  rel="stylesheet"
/>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #111;
    color: #ccc;
    font-family: -apple-system, Segoe UI, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #888; margin: 0 0 12px; }
  #status { font-size: 12px; margin-bottom: 12px; }
  #status.connected { color: #4caf50; }
  #status.disconnected { color: #e05a4e; }
  #screen-wrap {
    background: #000;
    border: 2px solid #333;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
  }
  canvas { display: block; image-rendering: pixelated; }
  #log {
    margin-top: 16px;
    width: 1024px;
    max-height: 360px;
    overflow-y: auto;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    padding: 8px;
    color: #888;
  }
  #log div:last-child { color: #ccc; }
  #tap-btn {
    margin-top: 16px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    color: #ccc;
    background: #222;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
  }
  #tap-btn:hover { background: #2c2c2c; }
  #tap-btn:active { background: #383838; }
  #unflip-label {
    display: block;
    font-size: 12px;
    color: #888;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  #unflip-label input { vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<h1>ActiveLook Glasses Simulator</h1>
<div id="status" class="disconnected">connecting to simulator server…</div>
<label id="unflip-label">
  <input type="checkbox" id="unflip-checkbox" checked />
  Un-flip coordinates (undo this unit's 180&deg; hardware quirk)
</label>
<div id="screen-wrap">
  <canvas id="screen" width="304" height="256" style="width: 608px; height: 512px;"></canvas>
</div>
<button id="tap-btn">Double tap (capacitive button)</button>
<div id="log"></div>

<script>
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

const W = 304, H = 256;

// ActiveLook grey levels are 0-15; render as CSS grey. Color-panel commands
// (rawColor/rawTextColor) use an approximate RG palette swatch instead -
// good enough to tell shapes/text apart, not a color-accurate reproduction
// of the real RG-only optic (ActiveLook_API.md's palette skews yellow/orange
// for most non-primary combinations, per this HUD's own doc comments).
function greyCss(level) {
  const v = Math.max(0, Math.min(15, level)) / 15;
  return `rgb(${Math.round(v*255)},${Math.round(v*255)},${Math.round(v*255)})`;
}

// The real ActiveLookColorPalette bytes (lib/src/activelook_types.dart): row = red level 0-8, column = green level
// 0-8. rawColor/rawTextColor send one of these bytes (green is 0xC3, yellow 0xFF, red 0x3C). Each byte is rendered
// as an approximate swatch for an RG-only optic - good enough to tell colours apart, not colour-accurate. (This used
// to be keyed 0/1/2, which never matched the real bytes, so every colour fell back to grey.)
const PALETTE_TABLE = [
  [0x00, 0x01, 0x02, 0x41, 0x81, 0x82, 0x43, 0x83, 0xC3],
  [0x04, 0x05, 0x06, 0x45, 0x85, 0x86, 0x47, 0x87, 0xC7],
  [0x20, 0x21, 0x22, 0x61, 0xA1, 0xA2, 0x63, 0xA3, 0xE3],
  [0x14, 0x15, 0x16, 0x55, 0x95, 0x96, 0x57, 0x97, 0xD7],
  [0x18, 0x19, 0x1A, 0x59, 0x99, 0x9A, 0x5B, 0x9B, 0xDB],
  [0x28, 0x29, 0x2A, 0x69, 0xA9, 0xAA, 0x6B, 0xAB, 0xEB],
  [0x1C, 0x1D, 0x1E, 0x5D, 0x9D, 0x9E, 0x5F, 0x9F, 0xDF],
  [0x38, 0x39, 0x3A, 0x79, 0xB9, 0xBA, 0x7B, 0xBB, 0xFB],
  [0x3C, 0x3D, 0x3E, 0x7D, 0xBD, 0xBE, 0x7F, 0xBF, 0xFF],
];
const PALETTE = {};
PALETTE_TABLE.forEach((row, redLevel) => row.forEach((byte, greenLevel) => {
  const r = redLevel / 8, g = greenLevel / 8;
  PALETTE[byte] = `rgb(${Math.round(224 * r)},${Math.round(207 * g)},${Math.round(60 * g)})`;
}));
function paletteCss(value) {
  return PALETTE[value] ?? '#ccc';
}

let currentGrey = 15;
let currentPaletteColor = null;

function log(text) {
  const line = document.createElement('div');
  line.textContent = text;
  logEl.appendChild(line);
  if (logEl.children.length > 200) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

function drawColor() {
  return currentPaletteColor ?? greyCss(currentGrey);
}

function clear() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
}
clear();

function point(x, y) {
  ctx.fillStyle = drawColor();
  ctx.fillRect(x, y, 1, 1);
}

function line(x1, y1, x2, y2) {
  ctx.strokeStyle = drawColor();
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x1 + 0.5, y1 + 0.5);
  ctx.lineTo(x2 + 0.5, y2 + 0.5);
  ctx.stroke();
}

function rect(x1, y1, x2, y2, filled) {
  ctx.strokeStyle = drawColor();
  ctx.fillStyle = drawColor();
  const x = Math.min(x1, x2), y = Math.min(y1, y2);
  const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
  if (filled) ctx.fillRect(x, y, w, h);
  else ctx.strokeRect(x + 0.5, y + 0.5, w, h);
}

function circle(x, y, r, filled) {
  ctx.strokeStyle = drawColor();
  ctx.fillStyle = drawColor();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  if (filled) ctx.fill();
  else ctx.stroke();
}

function polyline(xyPairs, thickness) {
  if (xyPairs.length < 4) return;
  ctx.strokeStyle = drawColor();
  ctx.lineWidth = thickness || 1;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(xyPairs[0], xyPairs[1]);
  for (let i = 2; i < xyPairs.length; i += 2) {
    ctx.lineTo(xyPairs[i], xyPairs[i + 1]);
  }
  ctx.stroke();
  ctx.lineWidth = 1;
}

// ALooK's real font ids -> pixel sizes (SourceSansPro SemiBold, see
// race_mode_glasses_hud.dart's _fontId doc comment: fonts are numbered 1-5,
// not 0-3). Font metrics still aren't pixel-identical to this Google Fonts
// "Source Sans 3" approximation (the real on-device font file isn't
// available to embed here), so id 2's size is knocked down from the real
// 38px to 34px - confirmed on real hardware (2026-09-09) that stat-row
// strings like "23.9 mph"/"4th of 7" fit comfortably without wrapping or
// clipping, which 38px here did not (measured ~151px wide against ~157px
// of available row width - too little margin for slightly longer values).
const FONT_PX = { 1: 24, 2: 34, 3: 64, 4: 75, 5: 82 };
function fontPx(fontSizeId) {
  return FONT_PX[fontSizeId] ?? 24;
}

// Clips to the canvas width so an oversized/overflowing string is visibly
// truncated instead of silently drawing off-canvas - real hardware simply
// wouldn't show what falls outside its own 304px buffer either.
function fillTextClipped(str, x, y) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();
  ctx.fillText(str, x, y);
  ctx.restore();
}

// The real family/weight the device renders text in (see FONT_PX's doc
// comment) - a proportional font, so text width here tracks the real
// device far more closely than the `monospace` fallback used previously
// (which measurably clipped longer strings against the canvas edge in a
// way the real hardware doesn't - see rowText's doc comment).
const DEVICE_FONT_FAMILY = '"Source Sans 3", monospace';
const DEVICE_FONT_WEIGHT = 600; // SemiBold

function text(x, y, fontSize, color, str) {
  ctx.fillStyle = greyCss(color);
  ctx.font = `${DEVICE_FONT_WEIGHT} ${fontPx(fontSize)}px ${DEVICE_FONT_FAMILY}`;
  ctx.textBaseline = 'top';
  fillTextClipped(str, x, y);
}

function rawText(x, y, fontSize, colorValue, str) {
  ctx.fillStyle = paletteCss(colorValue);
  ctx.font = `${DEVICE_FONT_WEIGHT} ${fontPx(fontSize)}px ${DEVICE_FONT_FAMILY}`;
  ctx.textBaseline = 'top';
  fillTextClipped(str, x, y);
}

function imgPlaceholder(x, y) {
  ctx.strokeStyle = '#666';
  ctx.strokeRect(x + 0.5, y + 0.5, 40, 40);
  ctx.fillStyle = '#666';
  ctx.font = '9px monospace';
  ctx.textBaseline = 'top';
  ctx.fillText('img', x + 4, y + 4);
}

// Real icon images (Engyne's own assets/icons/glasses/*.png, served from
// this tool's own icons/ copy - see server.dart) for layoutDisplay's stat
// rows, replacing the imgPlaceholder box those rows used before. Loaded
// once and cached by name; draws are silently skipped until each finishes
// loading (typically well before the app's first render call arrives).
const ICON_CACHE = {};
function loadIcon(name) {
  if (ICON_CACHE[name]) return ICON_CACHE[name];
  const img = new Image();
  img.src = `/icons/${name}.png`;
  ICON_CACHE[name] = img;
  return img;
}

// This simulator can't derive icon/text placement from the real wire
// values (imageX/imageY/textX/textY) - several attempts at a formula
// matching those hardware-confirmed constants (see layoutDisplay's doc
// comment) each produced a layout that didn't match a real render, and the
// exact rule those fields follow on this unit isn't known without hardware
// to test against. Confirmed directly instead (2026-09-09): each row is
// simply icon, then a gap, then left-aligned text, with every row's icon
// in one common vertical column regardless of that row's own text length.
// (x, y) here is the icon's plain top-left corner in canvas space - a
// fixed column shared by every row, not derived from any raw device point.
function rowIcon(name, x, y, size) {
  const img = loadIcon(name);
  if (!img.complete || img.naturalWidth === 0) return;
  ctx.drawImage(img, x, y, size, size);
}

// (x, y) is the text's plain left/baseline-bottom start in canvas space -
// left-aligned starting at a fixed X after the icon column, confirmed
// correct on real hardware (2026-09-09) rather than derived from the wire
// values (see rowIcon's doc comment).
function rowText(x, y, fontSize, colorValue, str) {
  ctx.fillStyle = paletteCss(colorValue);
  ctx.font = `${DEVICE_FONT_WEIGHT} ${fontPx(fontSize)}px ${DEVICE_FONT_FAMILY}`;
  ctx.textBaseline = 'bottom';
  ctx.textAlign = 'left';
  fillTextClipped(str, x, y);
}

// This viewer draws whatever raw device-buffer coordinates the app sends -
// correct as-is for a unit needing the 180deg flip ActiveLookSafeCanvas
// applies (see race_mode_glasses_hud.dart/activelook_safe_canvas.dart's doc
// comments: one physical unit was found to render raw (0,0) at the visual
// bottom-right, not top-left). The checkbox undoes that here, so a layout
// authored/reasoned about in plain top-left-origin terms previews that way
// instead - matches hardware that *doesn't* need the flip, or just a more
// intuitive preview while iterating on layout math.
const unflipCheckbox = document.getElementById('unflip-checkbox');
function unflip(x, y) {
  if (!unflipCheckbox.checked) return [x, y];
  return [(W - 1) - x, (H - 1) - y];
}

// layoutDisplay(id, text) only carries an id + string - the real position/
// font/size lives entirely on-device, saved earlier by layoutSave and never
// re-sent. This simulator can't know that in general, but Engyne's own
// stats-screen layouts are fixed and known (see
// Engyne/lib/services/race_mode/activelook_engyne_config.dart's
// chronoLayoutId/speedLayoutId/gapLayoutId/positionLayoutId and _rowLayout)
// - hardcoded here so the stats screen previews too, not just the map
// screen (which draws raw primitives, not saved layouts). A layout id not
// in this table still just logs, same as before.
//
// Row screen positions below (x0/y0) are activelook_engyne_config.dart's
// own real, hardware-confirmed _flipPoint(_rowX, y) output (_rowX=240, y =
// 50/110/170/230, screenWidth=304/screenHeight=256 per
// ActiveLookSafeCanvas) - this part is solid; it's what the map screen's
// own already-correct point/line/circle/text rendering uses the same way.
//
// The row's *internal* layout (icon-then-text) is NOT derived from the
// real wire values (imageX/imageY/textX/textY) below despite several
// attempts (2026-09-09): every formula tried - treating them as "distance
// from the row's own right/bottom edge" (matching textY, which does work
// that way), a plain container-local offset per ActiveLook_API.md §5.10's
// documented (but generic, not device-specific) contract, or a formula
// derived from Config-Generator/cfgDescriptor/engyne/config.json's
// original pre-port design values - each produced a layout that didn't
// match a real render (icons overlapping/misaligned text, wrong row
// pairing). The exact rule this unit's firmware applies to a layout's
// image sub-command isn't known without hardware to test against - textY's
// own "distance from right/bottom" rule doesn't reliably generalize to
// imageX/imageY the same way, and the API doc doesn't give this unit's
// specific firmware behavior since screen rotation isn't a documented
// protocol concept at all (only per-text `textRotation` is), so this unit's
// whole-buffer flip is a physical quirk outside what the spec models.
//
// ROW_ICON_X/ROW_TEXT_X below are a plain visual approximation instead -
// confirmed correct on real hardware (2026-09-09): icon, then a gap, then
// left-aligned text, with every row's icon in one shared vertical column
// regardless of that row's own text length. Revisit with real formula
// values if hardware becomes available to test imageX/imageY against.
const ROW_ICON_X = 15, ROW_TEXT_X = 65;
const ROW_ICON_SIZE = 40;
// Every row is currently saved with the same foregroundColor
// (ActiveLookColorPalette.green - _rowLayout's own comment: a test value to
// confirm per-shape color control, not a per-stat distinction) and fontId
// (2) - neither is carried on the layoutDisplay wire message itself (only
// id + text), so both are hardcoded here to match what _rowLayout actually
// saved rather than read off a field that doesn't exist on this command.
// If ActiveLookEngyneConfig ever gives rows their own distinct colors, this
// table needs a `color` per row too.
const ENGYNE_ROW_FONT_ID = 2;
const ENGYNE_ROW_COLOR = 1; // ActiveLookColorPalette.green, see PALETTE above
// x0/y0: _flipPoint(240, y) for y=50/110/170/230 (see this block's doc
// comment) - the row's own screen-relative top-left after this unit's one
// real, confirmed whole-screen 180deg flip.
const ENGYNE_LAYOUTS = {
  1: { x0: 63, y0: 205, icon: 'chrono' },   // chronoLayoutId: _rowLayout(id, 240, 50, ...)
  2: { x0: 63, y0: 145, icon: 'speed' },    // speedLayoutId: _rowLayout(id, 240, 110, ...)
  3: { x0: 63, y0: 85, icon: 'gap' },       // gapLayoutId: _rowLayout(id, 240, 170, ...)
  4: { x0: 63, y0: 25, icon: 'position' },  // positionLayoutId: _rowLayout(id, 240, 230, ...)
};
const ROW_HEIGHT = 50;

function layoutDisplay(id, str) {
  const row = ENGYNE_LAYOUTS[id];
  if (!row) {
    log(`(not rendered - unknown layout id) layoutDisplay {"id":${id},"text":${JSON.stringify(str)}}`);
    return;
  }
  // Row's bottom edge in raw device space (row.y0 is its already-flipped
  // top-left, per ENGYNE_LAYOUTS' doc comment) - inset off that edge, then
  // unflip() to canvas space, gives this row's text baseline. Icon/text
  // both sit on that same line (see ROW_ICON_X/ROW_TEXT_X's doc comment),
  // just offset horizontally. 43px (not a smaller inset like 9) so the
  // 40px-tall icon - drawn upward from this baseline - stays fully
  // on-canvas for the topmost row (chrono) instead of clipping off the top
  // edge (confirmed visually, 2026-09-09).
  const [, ty] = unflip(0, row.y0 + ROW_HEIGHT - 1 - 43);

  rowText(ROW_TEXT_X, ty, ENGYNE_ROW_FONT_ID, ENGYNE_ROW_COLOR, str);
  rowIcon(row.icon, ROW_ICON_X, ty - ROW_ICON_SIZE, ROW_ICON_SIZE);
}

function handle(msg) {
  switch (msg.cmd) {
    case 'clear': clear(); break;
    case 'color': currentGrey = msg.level; currentPaletteColor = null; break;
    case 'rawColor': currentPaletteColor = paletteCss(msg.value); break;
    case 'point': {
      const [x, y] = unflip(msg.x, msg.y);
      point(x, y);
      break;
    }
    case 'line': {
      const [x1, y1] = unflip(msg.x1, msg.y1);
      const [x2, y2] = unflip(msg.x2, msg.y2);
      line(x1, y1, x2, y2);
      break;
    }
    case 'rect': {
      const [x1, y1] = unflip(msg.x1, msg.y1);
      const [x2, y2] = unflip(msg.x2, msg.y2);
      rect(x1, y1, x2, y2, false);
      break;
    }
    case 'rectFilled': {
      const [x1, y1] = unflip(msg.x1, msg.y1);
      const [x2, y2] = unflip(msg.x2, msg.y2);
      rect(x1, y1, x2, y2, true);
      break;
    }
    case 'circle': {
      const [x, y] = unflip(msg.x, msg.y);
      circle(x, y, msg.radius, false);
      break;
    }
    case 'circleFilled': {
      const [x, y] = unflip(msg.x, msg.y);
      circle(x, y, msg.radius, true);
      break;
    }
    case 'polyline': {
      const pairs = [];
      for (let i = 0; i < msg.xyPairs.length; i += 2) {
        const [x, y] = unflip(msg.xyPairs[i], msg.xyPairs[i + 1]);
        pairs.push(x, y);
      }
      polyline(pairs, msg.thickness);
      break;
    }
    case 'text': {
      // Text has no rotation applied here (rotation id is passed through
      // untouched) - flipping only the anchor point is an approximation:
      // real 180deg-flipped hardware would also mirror the glyphs
      // themselves, which this canvas-text approximation doesn't attempt.
      const [x, y] = unflip(msg.x, msg.y);
      text(x, y, msg.fontSize, msg.color, msg.text);
      break;
    }
    case 'rawTextColor': {
      const [x, y] = unflip(msg.x, msg.y);
      rawText(x, y, msg.fontSize, msg.colorValue, msg.text);
      break;
    }
    case 'imgDisplay': {
      const [x, y] = unflip(msg.x, msg.y);
      imgPlaceholder(x, y);
      break;
    }
    case 'layoutDisplay':
      layoutDisplay(msg.id, msg.text);
      break;
    case 'layoutDisplayExtended':
    case 'layoutClearAndDisplay':
    case 'gaugeDisplay':
    case 'pageDisplay':
    case 'animDisplay':
      log(`(not rendered - saved on-device) ${msg.cmd} ${JSON.stringify(msg)}`);
      return;
    case 'holdFlush':
    case 'luma':
    case 'als':
    case 'power':
    case 'grey':
    case 'led':
    case 'shift':
    case 'sensor':
    case 'gesture':
    case 'configSet':
      break; // state/no-op commands, nothing to draw
    default:
      log(`(unhandled) ${msg.cmd} ${JSON.stringify(msg)}`);
      return;
  }
  log(JSON.stringify(msg));
}

let socket = null;
const tapBtn = document.getElementById('tap-btn');
tapBtn.addEventListener('click', () => {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  socket.send(JSON.stringify({ event: 'sensorTap' }));
  log('-> sensorTap (double tap)');
});

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/?role=viewer`);
  socket = ws;
  ws.onopen = () => {
    statusEl.textContent = 'connected - waiting for app';
    statusEl.className = 'connected';
  };
  ws.onclose = () => {
    statusEl.textContent = 'disconnected from simulator server - retrying…';
    statusEl.className = 'disconnected';
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (event) => {
    try {
      handle(JSON.parse(event.data));
    } catch (e) {
      log(`bad message: ${event.data}`);
    }
  };
}
connect();
</script>
</body>
</html>
